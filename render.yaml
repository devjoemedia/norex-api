# Render Blueprint for norex-api (Node runtime; database on Neon, not Render). Full steps: ../docs/17-deploy-render-cloudflare.md
# Render → New → Blueprint → pick this repo. Secrets marked `sync: false` are asked for
# on first deploy; set them in the dashboard afterwards.
services:
  - type: web
    name: norex-api
    runtime: node
    plan: free # sleeps after 15 min idle; no pre-deploy step or Shell on free
    region: frankfurt
    # Dev deps (Nest CLI, Prisma CLI) are needed to build, even with NODE_ENV=production.
    # The free plan has no pre-deploy step, so the schema update runs at the end of the
    # build, as the Neon owner over DIRECT_URL: `db push` refuses data-loss changes and
    # the guard/RLS SQL files are idempotent (safe on every deploy).
    buildCommand: >-
      npm ci --include=dev && npx prisma generate && npm run build &&
      npx prisma db push --skip-generate &&
      npx prisma db execute --url "$DIRECT_URL" --file prisma/currency-guard.sql &&
      npx prisma db execute --url "$DIRECT_URL" --file prisma/rls.sql
    startCommand: npm run start:prod
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Neon (Frankfurt). Runtime = POOLED host (-pooler) as norex_app, with
      # ?sslmode=require&pgbouncer=true&connect_timeout=15
      - key: DATABASE_URL
        sync: false
      # Schema changes = DIRECT host (no -pooler) as neondb_owner, ?sslmode=require
      - key: DIRECT_URL
        sync: false
      # Never rotate these two after launch: they key OTPs, KYC hashes and encrypted data.
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Same value as NOREX_API_KEY on every website Worker.
      - key: WEB_INTAKE_KEY
        sync: false
      # Admin portal origin(s), comma-separated, e.g. https://admin.norexgambia.com
      - key: CORS_ORIGINS
        sync: false
      # The Gambia website serves device photos for the portal.
      - key: DEVICE_IMAGE_BASE_URL
        value: https://norexgambia.com
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: THROTTLE_LIMIT
        value: "120"

